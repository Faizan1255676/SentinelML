version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinelml-api
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --workers 2
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - API_PORT=8000
    volumes:
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinelml-dashboard
    command: streamlit run app/dashboard.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - APP_ENV=production
    volumes:
      - ./models:/app/models
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
